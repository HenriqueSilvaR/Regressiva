<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4 anos de nós ❤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c8102e;
    --red-dark:#8b0a1f;
    --red-soft:#ff4d6d;
    --pink:#fff0f2;
    --white:#ffffff;
    --ink:#4a0d18;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;
    color:var(--ink);
    background:var(--white);
    overflow-x:hidden;
  }
  h1,h2{font-family:'Playfair Display',Georgia,serif}
  .script{font-family:'Dancing Script',cursive}

  /* ---------- INTRO ---------- */
  #intro{
    position:fixed;inset:0;z-index:1000;
    background:radial-gradient(circle at 50% 40%,var(--red-soft),var(--red) 55%,var(--red-dark));
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
    color:#fff;text-align:center;cursor:pointer;
    transition:opacity .9s ease,transform .9s ease;
  }
  #intro.hide{opacity:0;transform:scale(1.15);pointer-events:none}
  #intro .big-heart{font-size:clamp(90px,22vw,170px);animation:beat 1.2s infinite;filter:drop-shadow(0 10px 25px rgba(0,0,0,.3))}
  #intro h2{font-size:clamp(1.4rem,5vw,2.2rem);padding:0 20px}
  #intro p{opacity:.9;animation:blink 1.8s infinite}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.18)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
  @keyframes blink{50%{opacity:.35}}

  /* ---------- HERO ---------- */
  #hero{
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 20px;
    background:linear-gradient(180deg,var(--pink),#fff 85%);
  }
  #hero .tag{letter-spacing:.35em;text-transform:uppercase;font-size:.8rem;color:var(--red);font-weight:700}
  #hero h1{font-size:clamp(4.5rem,22vw,11rem);line-height:1;color:var(--red);margin:6px 0;position:relative}
  #hero h1 small{display:block;font-size:.22em;letter-spacing:.2em;color:var(--red-dark);font-style:italic}
  #hero .name{font-size:clamp(1.8rem,6vw,3rem);color:var(--red-dark)}
  #heroStatus{margin:30px 0 10px;font-size:1.1rem;font-weight:700;color:var(--red-dark)}
  .count-grid{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .count-box{
    background:#fff;border:2px solid var(--red);border-radius:18px;
    min-width:78px;padding:14px 10px;box-shadow:0 8px 20px rgba(200,16,46,.15);
  }
  .count-box b{display:block;font-family:'Playfair Display',serif;font-size:2rem;color:var(--red)}
  .count-box span{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;opacity:.7}
  .since{margin-top:26px;opacity:.8}

  /* ---------- EXTRAS ---------- */
  .fly{position:fixed;pointer-events:none;z-index:5;color:var(--red-soft);animation:up linear forwards;user-select:none}
  @keyframes up{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
  .pop{position:fixed;pointer-events:none;z-index:2000;font-size:1.2rem;animation:pop .9s ease-out forwards}
  @keyframes pop{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:1500}
  #musicBtn{
    position:fixed;right:16px;bottom:16px;z-index:800;border:none;border-radius:50%;width:50px;height:50px;
    background:var(--red);color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.25);display:none
  }
  #musicBtn.off{opacity:.6}
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="big-heart">❤</div>
  <h2>Preparei uma coisinha pra você…</h2>
  <p>Toque para abrir</p>
</div>

<!-- CONTADOR -->
<section id="hero">
  <div class="tag">06 · 11 · 2022 → 06 · 11 · 2026</div>
  <h1>4<small>ANOS</small></h1>
  <div class="name script" id="nomeDela"></div>
  <div id="heroStatus"></div>
  <div class="count-grid" id="counter"></div>
  <p class="since" id="sinceText"></p>
</section>

<canvas id="confetti"></canvas>
<button id="musicBtn" title="Música">♪</button>
<audio id="audio" loop></audio>

<script>
/* =====================================================================
   ✏️ EDITE AQUI
   ===================================================================== */
const CONFIG = {
  nomeDela: "Ana",                       // ← o nome (ou apelido) dela

  inicio:      "2022-11-06T00:00:00",   // começo do namoro
  aniversario: "2026-11-06T00:00:00",   // dia dos 4 anos

  // 🎵 Música: coloque o arquivo na mesma pasta do index (ex.: "musica.mp3") e escreva o nome aqui.
  // Deixe "" para não ter música (o botão ♪ só aparece quando há música).
  musica: "musica.mp3"
};
/* ===================================================================== */

const $ = s => document.querySelector(s);
const START = new Date(CONFIG.inicio);
const ANNIV = new Date(CONFIG.aniversario);

/* Modo teste: abra com  ?dia=1  no final do endereço para simular o dia dos 4 anos */
const TEST = new URLSearchParams(location.search).has("dia");
const OFFSET = TEST ? (ANNIV - Date.now() + 1000) : 0;
const now = () => new Date(Date.now() + OFFSET);

$("#nomeDela").textContent = CONFIG.nomeDela;

/* ---------- Contador ---------- */
function diffCal(a, b){
  let y=b.getFullYear()-a.getFullYear(), m=b.getMonth()-a.getMonth(), d=b.getDate()-a.getDate(),
      h=b.getHours()-a.getHours(), mi=b.getMinutes()-a.getMinutes(), s=b.getSeconds()-a.getSeconds();
  if(s<0){s+=60;mi--} if(mi<0){mi+=60;h--} if(h<0){h+=24;d--}
  if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();m--}
  if(m<0){m+=12;y--}
  return {y,m,d,h,mi,s};
}
const pad = n => String(n).padStart(2,"0");
let celebrated = false, introDone = false;

function tick(){
  const n = now();
  const t = diffCal(START, n);
  const boxes = [["anos",t.y],["meses",t.m],["dias",t.d],["horas",pad(t.h)],["min",pad(t.mi)],["seg",pad(t.s)]];
  $("#counter").innerHTML = boxes.map(([l,v])=>`<div class="count-box"><b>${v}</b><span>${l}</span></div>`).join("");

  const totalDays = Math.floor((n - START) / 864e5);
  $("#sinceText").innerHTML = `Já são <b>${totalDays.toLocaleString("pt-BR")}</b> dias de nós, desde 06/11/2022 ❤`;

  const status = $("#heroStatus");
  if (n < ANNIV){
    const left = ANNIV - n;
    const d = Math.floor(left/864e5), h = Math.floor(left%864e5/36e5), m = Math.floor(left%36e5/6e4), s = Math.floor(left%6e4/1e3);
    status.textContent = `Faltam ${d} dias, ${pad(h)}h ${pad(m)}min ${pad(s)}s para completarmos 4 anos`;
  } else {
    status.textContent = "Hoje a gente faz 4 anos juntos! ❤";
    if (!celebrated && introDone){ celebrated = true; confetti(220); }
  }
}
setInterval(tick, 1000); tick();

/* ---------- Corações flutuando ---------- */
function flyHeart(){
  const h = document.createElement("div");
  h.className = "fly";
  h.textContent = Math.random()<.2 ? "💗" : "❤";
  const size = 14 + Math.random()*26;
  h.style.cssText += `left:${Math.random()*100}vw;bottom:-40px;font-size:${size}px;animation-duration:${7+Math.random()*7}s;opacity:${.25+Math.random()*.5}`;
  document.body.appendChild(h);
  setTimeout(()=>h.remove(), 15000);
}
setInterval(flyHeart, 900);

/* ---------- Toque solta coraçõezinhos ---------- */
document.addEventListener("pointerdown", e=>{
  if (e.target.closest("#intro")) return;
  for(let i=0;i<7;i++){
    const p = document.createElement("div");
    p.className = "pop"; p.textContent = "❤";
    p.style.left = e.clientX+"px"; p.style.top = e.clientY+"px";
    p.style.setProperty("--dx", (Math.random()*120-60)+"px");
    p.style.setProperty("--dy", (-40-Math.random()*90)+"px");
    document.body.appendChild(p); setTimeout(()=>p.remove(), 900);
  }
});

/* ---------- Confete ---------- */
const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], running = false;
function sizeCv(){ cv.width = innerWidth; cv.height = innerHeight; }
sizeCv(); addEventListener("resize", sizeCv);
function confetti(n=150){
  const colors = ["#c8102e","#ff4d6d","#ffffff","#8b0a1f","#ffb3c1"];
  for(let i=0;i<n;i++) parts.push({
    x: Math.random()*cv.width, y: -20-Math.random()*cv.height*.4,
    vx: Math.random()*4-2, vy: 2+Math.random()*4, r: Math.random()*6.28, vr: Math.random()*.3-.15,
    s: 8+Math.random()*10, c: colors[Math.floor(Math.random()*colors.length)], heart: Math.random()<.45
  });
  if(!running){ running = true; loop(); }
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.vy+=.02;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.strokeStyle = "rgba(139,10,31,.35)";
    if(p.heart){ cx.font = p.s*1.6+"px serif"; cx.fillText("❤",-p.s/2,p.s/2); }
    else { cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); cx.strokeRect(-p.s/2,-p.s/4,p.s,p.s/2); }
    cx.restore();
  });
  parts = parts.filter(p=>p.y < cv.height+40);
  if(parts.length) requestAnimationFrame(loop); else running = false;
}

/* ---------- Música opcional ---------- */
const audio = $("#audio"), mbtn = $("#musicBtn");
if (CONFIG.musica){
  audio.src = CONFIG.musica; mbtn.style.display = "block";
  mbtn.onclick = () => {
    if (audio.paused){ audio.play().catch(()=>{}); mbtn.classList.remove("off"); }
    else { audio.pause(); mbtn.classList.add("off"); }
  };
}

/* ---------- Abrir o presente ---------- */
$("#intro").addEventListener("click", ()=>{
  $("#intro").classList.add("hide");
  introDone = true;
  if (CONFIG.musica) audio.play().catch(()=>{});
  for(let i=0;i<14;i++) setTimeout(flyHeart, i*120);
  tick();
  if (now() >= ANNIV) { celebrated = true; confetti(220); }
});
</script>
</body>
</html>
